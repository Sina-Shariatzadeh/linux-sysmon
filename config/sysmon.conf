# sysmon configuration (key = value, '#' starts a comment)
# Installed to /etc/sysmon/sysmon.conf; every key is optional.

[sources]
proc_root        = /proc
sys_root         = /sys
auth_log_paths   = /var/log/auth.log, /var/log/secure
include_loopback = false
# hostname       = web-01          # defaults to gethostname()

[engine]
interval_ms      = 1000
worker_threads   = 4

[database]
db_enabled          = true
db_conninfo         = host=localhost port=5432 dbname=sysmon user=sysmon password=sysmon
retention_days      = 30
process_top_n       = 25
process_store_every = 5
db_queue_capacity   = 600

[live]
live_enabled = true
live_bind    = 127.0.0.1
live_port    = 9090
live_top_n   = 50

[alerts]
cpu_alert_pct         = 90
mem_alert_pct         = 90
swap_alert_pct        = 50
disk_alert_pct        = 90
alert_sustain_samples = 5
alert_cooldown_s      = 300

[security]
anomaly_zscore              = 3.5
anomaly_warmup_samples      = 30
cpu_anomaly_min_pct         = 60
net_anomaly_min_bps         = 5000000
tcp_anomaly_min_connections = 100
proc_cpu_hog_pct            = 90
proc_cpu_hog_samples        = 30
failed_login_threshold      = 5
failed_login_window_s       = 300
event_cooldown_s            = 120
suspicious_names = xmrig, minerd, cpuminer, kdevtmpfsi, kinsing, ncat, socat, nc, hydra, masscan
suspicious_paths = /tmp/, /dev/shm/, /var/tmp/
